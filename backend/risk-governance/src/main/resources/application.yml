server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: 8084
  servlet:
    session:
      cookie:
        name: WBSESSION
        http-only: true
        same-site: lax
        path: /
        secure: ${WORKBENCH_COOKIE_SECURE:false}

spring:
  application:
    name: risk-governance

  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      table-name: WB_SESSION

  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    driver-class-name: oracle.jdbc.OracleDriver
    username: system
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    table: risk_governance_flyway_history
    baseline-on-migrate: true
    baseline-version: "0"

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

springdoc:
  api-docs:
    enabled: ${WORKBENCH_DEMO_ENABLED:false}
    path: /v3/api-docs
  paths-to-match: /api/**
  swagger-ui:
    enabled: ${WORKBENCH_DEMO_ENABLED:false}
    path: /swagger-ui.html
    disable-swagger-default-url: true
    operations-sorter: alpha
    tags-sorter: alpha
    filter: true
    persist-authorization: false

workbench:
  openapi:
    title: Risk Governance API