server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: 8081
  servlet:
    session:
      cookie:
        name: WBSESSION
        http-only: true
        same-site: lax
        path: /
        secure: ${WORKBENCH_COOKIE_SECURE:false}

spring:
  application:
    name: project-2

  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      table-name: WB_SESSION

  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${DB_USER:user}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    table: access_data_flyway_history
    baseline-on-migrate: true
    baseline-version: "0"

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        max.request.size: 12582912
    consumer:
      group-id: access-data-v1
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.partition.fetch.bytes: 12582912
    listener:
      ack-mode: record

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

springdoc:
  api-docs:
    enabled: ${WORKBENCH_DEMO_ENABLED:false}
    path: /v3/api-docs
  paths-to-match: /api/**
  swagger-ui:
    enabled: ${WORKBENCH_DEMO_ENABLED:false}
    path: /swagger-ui.html
    disable-swagger-default-url: true
    operations-sorter: alpha
    tags-sorter: alpha
    filter: true
    persist-authorization: false

workbench:
  openapi:
    title: Access & Data API