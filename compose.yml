name: nbfc-workbench
x-security: &security
  WORKBENCH_DEMO_ENABLED: "true"
  SERVER_ADDRESS: 0.0.0.0
x-db: &database
  DB_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
  DB_USER: user
  DB_PASSWORD: vikas123
  KAFKA_BOOTSTRAP: kafka:9092
services:
  oracle:
    image: container-registry.oracle.com/database/free:latest
    ports: ["127.0.0.1:1521:1521"]
    environment:
      ORACLE_PWD: ${ORACLE_PWD:?Copy .env.example to .env}
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./infra/oracle:/opt/oracle/scripts/setup:ro
    healthcheck:
      test: ["CMD", "/opt/oracle/checkDBStatus.sh"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s
  kafka:
    image: apache/kafka:4.0.0
    ports: ["127.0.0.1:9092:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MESSAGE_MAX_BYTES: 12582912
      KAFKA_REPLICA_FETCH_MAX_BYTES: 12582912
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: [kafka-data:/var/lib/kafka/data]
  access-data:
    build: { context: ., dockerfile: backend/Dockerfile, args: { SERVICE: access-data } }
    environment:
      <<: [*security, *database]
      SPRING_KAFKA_PRODUCER_PROPERTIES_MAX_REQUEST_SIZE: 12582912
    depends_on:
      oracle: { condition: service_healthy }
      kafka: { condition: service_started }
    restart: on-failure
  exposure-analytics:
    build: { context: ., dockerfile: backend/Dockerfile, args: { SERVICE: exposure-analytics } }
    environment:
      <<: [*security, *database]
      SPRING_KAFKA_CONSUMER_PROPERTIES_MAX_PARTITION_FETCH_BYTES: 12582912
    depends_on:
      oracle: { condition: service_healthy }
      kafka: { condition: service_started }
      access-data: { condition: service_started }
    restart: on-failure
  stress-simulation:
    build: { context: ., dockerfile: backend/Dockerfile, args: { SERVICE: stress-simulation } }
    environment: *security
  risk-governance:
    build: { context: ., dockerfile: backend/Dockerfile, args: { SERVICE: risk-governance } }
    environment:
      <<: [*security, *database]
    depends_on:
      oracle: { condition: service_healthy }
      kafka: { condition: service_started }
    restart: on-failure
  gateway:
    build: { context: ., dockerfile: backend/Dockerfile, args: { SERVICE: gateway } }
    environment:
      <<: *security
      ACCESS_DATA_URL: http://access-data:8081
      EXPOSURE_ANALYTICS_URL: http://exposure-analytics:8082
      RISK_GOVERNANCE_URL: http://risk-governance:8084
    ports: ["127.0.0.1:8090:8090"]
  frontend:
    build: { context: ., dockerfile: frontend/Dockerfile }
    environment:
      API_PROXY_TARGET: http://gateway:8090
    ports: ["127.0.0.1:5173:5173"]
volumes:
  oracle-data:
  kafka-data:
